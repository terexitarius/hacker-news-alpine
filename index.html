---
layout: default
permalink: /
---

<div x-data="{ stories: [], intervalId: null }"
     x-effect="stories = await getItems(current, page)"
     x-init="
       if (page == 1) {
         intervalId = setInterval(async () => {
          stories = await getItems(current, page)
        }, 150000)
      }">

  <template x-if="stories.length === 0">
    {%- include loading.html -%}
  </template>

  <template x-if="stories.length > 0">

    <div>
      <div class="refresh-hint" x-show="page == 1">
        Refreshing every 2.5 minutes to match HN updates
      </div>

      <ul class="stories-list">

        <template x-for="story, index in stories">

          <li class="story-item">

            <div class="story-rank" x-text="page == 1 ? index + 1 : ((page - 1) * stories.length) + (index + 1)"></div>

            <div class="story-body">

              <template x-if="story.hasOwnProperty('domain')">
                <a :href="story.url" target="_blank" rel="noopener noreferrer">
                  <div class="story-title" x-text="story.title"></div>
                  <span class="story-domain" x-text="`${story.domain}`"></span>
                </a>
              </template>

              <template x-if="!story.hasOwnProperty('domain')">
                <a :href="getItemLink(story.id)">
                  <div class="story-title" x-text="story.title"></div>
                </a>
              </template>

              <div class="story-meta">
                <span x-text="story.points"></span>
                <span>points</span>
                <span class="sep">·</span>
                <span>by</span>
                <a :href="getUserLink(story.user)">
                  <span x-text="story.user"></span>
                </a>
                <span class="sep">·</span>
                <span x-text="story.time_ago"></span>
                <span class="sep">·</span>
                <a :href="getItemLink(story.id)">
                  <span x-text="story.comments_count"></span>
                  <span>comments</span>
                </a>
              </div>

            </div>

          </li>

        </template>

      </ul>

      <div class="page-nav">
        <a :class="Number(page) <= 1 ? 'disabled' : ''" :href="`/?section=${current}&page=${Number(page) - 1}`">← Previous</a>
        <a :class="stories.length === 0 ? 'disabled' : ''" :href="`/?section=${current}&page=${Number(page) + 1}`">Next →</a>
      </div>

      <div class="text-center my-2">
          <a href="/about" class="text-underline">About</a>
      </div>

    </div>

  </template>

</div>
