---
layout: default
title: Comments
---

<div x-data="{story: { }}" x-init="story = await getItem(getParam(document.location.search, 'id').slice(0, -5))">

  <template x-if="!story.hasOwnProperty('title')">
    {%- include loading.html -%}
  </template>

  <template x-if="story.hasOwnProperty('title')">
    <div>

      <div class="story-card">
        <h1 class="story-title" x-text="story.title"></h1>

        <template x-if="story.hasOwnProperty('domain')">
          <a :href="story.url" target="_blank" rel="noopener noreferrer" class="story-domain-link" x-text="story.domain"></a>
        </template>

        <p class="item-info">
          <span x-text="story.points"></span>
          <span> points · by </span>
          <a :href="getUserLink(story.user)">
            <span x-text="story.user" class="text-bold"></span>
          </a>
          <span> · </span>
          <span x-text="story.time_ago"></span>
        </p>

        <div x-html="story.content" class="content"></div>

        <div class="story-meta" style="margin-top:1.25rem">
          <a :href="story.url" target="_blank" rel="noopener noreferrer">Read full article →</a>
          <span class="sep">·</span>
          <a :href="getItemLink(story.id)">
            <span x-text="story.comments_count"></span>
            <span> comments</span>
          </a>
        </div>
      </div>

      <h2 class="comments-header">Discussion</h2>

      <template x-for="comment in getComments(story)">
        <div class="comment-wrapper" :style="{ marginLeft: `${Math.min(comment.level, 4) * 1.1}rem` }">
          <div class="comment">
            <p class="comment-head">
              <a :href="getUserLink(comment.user)">
                <span x-text="comment.user"></span>
              </a>
              <span class="sep">·</span>
              <span x-text="comment.time_ago"></span>
            </p>
            <div x-html="comment.content"></div>
          </div>
        </div>
      </template>

      <div class="text-center my-2">
          <a href="/">← Back to top</a>
      </div>

    </div>
  </template>

</div>
