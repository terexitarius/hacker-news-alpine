2|layout: default
3|title: Comments
4|---
5|
6|<div x-data="{ story: { }, intervalId: null }" x-init="
7|  story = await getItem(getParam(document.location.search, 'id').slice(0, -5));
8|  intervalId = setInterval(async () => {
9|    story = await getItem(getParam(document.location.search, 'id').slice(0, -5))
10|  }, 150000)
11|">
12|
13|  <template x-if="!story.hasOwnProperty('title')">
14|    {%- include loading.html -%}
15|  </template>
16|
17|  <template x-if="story.hasOwnProperty('title')">
18|    <div>
19|
20|      <div class="story-card">
21|        <h1 class="story-title" x-text="story.title"></h1>
22|
23|        <template x-if="story.hasOwnProperty('domain')">
24|          <a :href="story.url" target="_blank" rel="noopener noreferrer" class="story-domain-link" x-text="story.domain"></a>
25|        </template>
26|
27|        <p class="item-info">
28|          <span x-text="story.points"></span>
29|          <span> points · by </span>

32|          </a>
33|          <span> · </span>

36|

38|

43|            <span x-text="story.comments_count"></span>
44|            <span> comments</span>
45|          </a>

57|              </a>
58|              <span class="sep">·</span>

60|            </p>
61|            <div x-html="comment.content"></div>
62|          </div>
63|        </div>

65|

67|          <a href="/">← Back to top</a>
68|      </div>
69|
70|    </div>

73|</div>
